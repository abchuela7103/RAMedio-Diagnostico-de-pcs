<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMedio - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            text-align: center;
        }
        
        .form-group-login {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group-login label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group-login input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-family: inherit;
        }

        .form-group-login input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .toggle-mode {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-decoration: underline;
        }
        
        .toggle-mode:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: #222;">
    <main class="card p-4 p-md-5 rounded-0 border-0" style="width: 100%; max-width: 500px; background-color: #303030;">
        <header class="text-center mb-4">
            <h2 class="text-light fw-bold" style="letter-spacing: 1px;">RAMedio Login</h2>
        </header>

        <form id="auth-form">
            <div class="mb-4 text-center">
                <label for="username" class="form-label text-light fs-5">Usuario:</label>
                <input type="text" id="username" name="username" class="form-control rounded-0 bg-dark text-light border-secondary" required>
            </div>
            
            <div class="mb-4 text-center">
                <label for="password" class="form-label text-light fs-5">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control rounded-0 bg-dark text-light border-secondary" required>
            </div>

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-primary rounded-0 mb-3" id="submit-btn" style="width: 200px; font-weight: 500;">
                <span id="btn-text">Iniciar Sesión</span>
                <div class="loader hidden" id="loader" style="display: inline-block; width: 1.5rem; height: 1.5rem;"></div>
            </button>
            <br>
            <button type="button" class="btn btn-link text-light text-decoration-none" id="toggle-mode-btn">Registrarse</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
