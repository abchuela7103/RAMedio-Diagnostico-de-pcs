<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMedio - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            text-align: center;
        }
        
        .form-group-login {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group-login label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group-login input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-family: inherit;
        }

        .form-group-login input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .toggle-mode {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-decoration: underline;
        }
        
        .toggle-mode:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="background-animation"></div>

    <main class="container glass-panel login-container p-4 p-md-5">
        <header>
            <div class="logo-container" style="justify-content: center;">
                <div class="pulse-ring"></div>
                <h1>RAMedio</h1>
            </div>
            <p class="subtitle" id="form-subtitle">Inicia sesión en tu cuenta</p>
        </header>

        <form id="auth-form">
            <div class="form-group-login">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required>
            </div>
            
            <div class="form-group-login">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span id="btn-text">Iniciar Sesión</span>
                <div class="loader hidden" id="loader"></div>
            </button>
        </form>

        <button type="button" class="toggle-mode" id="toggle-mode-btn">¿No tienes cuenta? Regístrate aquí</button>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
