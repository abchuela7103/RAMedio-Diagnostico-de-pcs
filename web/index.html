<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMedio - Diagnóstico de PCs</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <!-- Apache ECharts para la Animación Frontal -->
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>

<body style="background-color: #222;">
    <main class="card rounded-4 border-0 p-4 p-md-5 mx-auto mt-5 mb-5 main-card" style="background-color: #303030; max-width: 800px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);">
        <header>
            <div class="logo-container">
                <div class="pulse-ring"></div>
                <h1>RAMedio</h1>
            </div>
            <p class="subtitle">Sistema Distribuido de Diagnóstico de PCs</p>
        </header>

        <form id="diagnosis-form">
            <section class="form-group primary-input">
                <label for="device_id" class="ms-1">ID del Equipo (Auto-Detectado) <span class="required">*</span></label>
                <input type="text" id="device_id" name="device_id" class="form-control rounded-4 bg-dark text-light border-secondary text-center" placeholder="Detectando ID del equipo..." readonly required>
                <small class="ms-1">Este ID vincula tu reporte con los datos de hardware enviados por el agente RAMedio.</small>
            </section>

            <div class="divider"></div>

            <section class="symptoms-section position-relative">
                <h2 class="mb-4 text-center">Cuestionario de Síntomas</h2>
                
                <!-- Progress Bar -->
                <div class="progress mb-2 bg-dark rounded-pill" style="height: 12px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
                    <div id="form-progress-bar" class="progress-bar bg-primary rounded-pill transition-all" role="progressbar" style="width: 33%; transition: width 0.4s ease;" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <div class="d-flex justify-content-between mb-4 text-muted small">
                    <span id="step-indicator" class="fw-bold text-primary">Paso 1 de 3</span>
                    <span id="step-desc">Rendimiento y Energía</span>
                </div>

                <div class="form-steps-container" style="position: relative;">
                    <!-- STEP 1 -->
                    <div class="form-step active" id="step-1">
                        <!-- Q1 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">1. ¿Sientes que el equipo está inusualmente lento al abrir programas?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="slow_yes" name="is_slow" value="true" required>
                                <label for="slow_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="slow_no" name="is_slow" value="false">
                                <label for="slow_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q2 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">2. ¿El equipo se apaga o reinicia solo de forma inesperada?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="restart_yes" name="random_restarts" value="true" required>
                                <label for="restart_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="restart_no" name="random_restarts" value="false">
                                <label for="restart_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q3 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">3. ¿Escuchas ruidos extraños de ventiladores o discos mecánicos?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="noise_yes" name="weird_noises" value="true" required>
                                <label for="noise_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="noise_no" name="weird_noises" value="false">
                                <label for="noise_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q4 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">4. ¿Has notado que la máquina se calienta demasiado al tacto?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="hot_yes" name="overheating" value="true" required>
                                <label for="hot_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="hot_no" name="overheating" value="false">
                                <label for="hot_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q5 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">5. ¿Aparecen pantallas azules o errores críticos con frecuencia?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="bsod_yes" name="bsod_errors" value="true" required>
                                <label for="bsod_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="bsod_no" name="bsod_errors" value="false">
                                <label for="bsod_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 2 -->
                    <div class="form-step hidden" id="step-2">
                        <!-- Q6 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">6. ¿La pantalla parpadea o se apaga sola?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="flicker_yes" name="screen_flicker" value="true" required>
                                <label for="flicker_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="flicker_no" name="screen_flicker" value="false">
                                <label for="flicker_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q7 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">7. ¿Las aplicaciones se cierran inesperadamente?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="apps_yes" name="apps_crashing" value="true" required>
                                <label for="apps_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="apps_no" name="apps_crashing" value="false">
                                <label for="apps_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q8 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">8. ¿La batería no retiene carga o se descarga rápido?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="bat_yes" name="battery_issue" value="true" required>
                                <label for="bat_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="bat_no" name="battery_issue" value="false">
                                <label for="bat_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q9 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">9. ¿Has percibido algún olor inusual (a quemado)?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="smell_yes" name="burnt_smell" value="true" required>
                                <label for="smell_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="smell_no" name="burnt_smell" value="false">
                                <label for="smell_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q10 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">10. ¿Aparecen cuadros de colores, líneas o la pantalla se deforma al jugar o ver videos?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="art_yes" name="visual_artifacts" value="true" required>
                                <label for="art_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="art_no" name="visual_artifacts" value="false">
                                <label for="art_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 3 -->
                    <div class="form-step hidden" id="step-3">
                        <!-- Q11 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">11. ¿El equipo se congela por completo pero no se apaga?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="freeze_yes" name="system_freezes" value="true" required>
                                <label for="freeze_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="freeze_no" name="system_freezes" value="false">
                                <label for="freeze_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q12 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">12. ¿Los dispositivos USB se desconectan solos de repente?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="usb_yes" name="usb_disconnects" value="true" required>
                                <label for="usb_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="usb_no" name="usb_disconnects" value="false">
                                <label for="usb_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q13 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">13. ¿La red Wi-Fi o Ethernet se cae a cada rato sin razón?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="net_yes" name="network_drops" value="true" required>
                                <label for="net_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="net_no" name="network_drops" value="false">
                                <label for="net_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q14 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">14. ¿El equipo tarda muchísimo tiempo en dar imagen al encender?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="boot_yes" name="slow_boot" value="true" required>
                                <label for="boot_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="boot_no" name="slow_boot" value="false">
                                <label for="boot_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>

                        <!-- Q15 -->
                        <div class="card p-4 mb-3 rounded-4 border-secondary question-card">
                            <label class="fw-semibold mb-3">15. ¿Se han dañado archivos misteriosamente o Windows pide revisar el disco al encender?</label>
                            <div class="btn-group d-flex gap-2">
                                <input type="radio" class="btn-check" id="corr_yes" name="file_corruption" value="true" required>
                                <label for="corr_yes" class="btn btn-outline-danger rounded-4 w-100 radio-label">Sí</label>
                                <input type="radio" class="btn-check" id="corr_no" name="file_corruption" value="false">
                                <label for="corr_no" class="btn btn-outline-success rounded-4 w-100 radio-label">No</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-secondary rounded-pill px-4 py-2 hidden" id="prev-btn" style="font-weight: 600;">← Atrás</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 py-2 ms-auto" id="next-btn" style="font-weight: 600;">Siguiente →</button>
                    <button type="submit" class="btn btn-success rounded-pill px-4 py-2 ms-auto hidden" id="submit-btn" style="font-weight: 600;">
                        <span>Finalizar y Enviar</span>
                        <div class="loader hidden" style="display: inline-block; width: 1.2rem; height: 1.2rem; margin-left: 8px; vertical-align: middle;"></div>
                    </button>
                </div>
            </section>
        </form>

        <div id="success-message" class="hidden text-center mt-4">
            <div class="success-icon">✓</div>
            <h3 class="mb-3">¡Datos Registrados!</h3>

            <div id="diagnosis-box" class="diagnosis-box hidden rounded-4">
                <h4 class="mb-3">Diagnóstico de tu equipo</h4>
                <p id="diagnosis-text" class="diagnosis-text mb-4">Analizando...</p>
                <div id="index-tree-chart" style="width: 100%; height: 400px; display: none; margin-top: 15px;"></div>
            </div>

            <div class="actions-group d-flex gap-3 justify-content-center mt-4">
                <button id="go-dashboard-btn" class="btn btn-info rounded-pill px-4 py-2 hidden text-dark fw-bold">Ver Detalles en Dashboard</button>
                <button id="reset-btn" class="btn btn-secondary rounded-pill px-4 py-2 fw-bold">Enviar otro reporte</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js?v=6"></script>
</body>

</html>
