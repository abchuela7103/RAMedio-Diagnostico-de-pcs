<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Diagnósticos</title>
    <!-- Modern Font and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ══ TOKENS ══ */
        :root {
            --bg:          #060f1c;
            --bg-card:     rgba(11, 25, 41, 0.6);
            --bg-inner:    rgba(14, 32, 56, 0.5);
            --primary:     #2d8cf0;
            --primary-lt:  #58b3ff;
            --primary-dk:  #1565c0;
            --accent:      #06d6f5;
            --green:       #22d3a0;
            --amber:       #f59e0b;
            --red:         #f87171;
            --txt:         #d4e9ff;
            --txt-soft:    #9dbedd;
            --txt-muted:   #5e85ab;
            --border:      rgba(56,139,253,.2);
            --border-soft: rgba(56,139,253,.15);
            --shadow-sm:   0 2px 8px rgba(0,20,60,.3);
            --shadow-md:   0 8px 28px rgba(0,30,90,.35);
            --shadow-lg:   0 12px 48px rgba(0,50,140,.28);
            --r-card:      24px;
            --r-btn:       16px;
            --r-inner:     16px;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 90% 55% at 50% -10%, rgba(10,55,130,.45) 0%, transparent 70%),
                radial-gradient(ellipse 35% 35% at 90% 85%, rgba(0,150,210,.1) 0%, transparent 55%);
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            color: var(--txt);
        }

        .glass-card {
            background: var(--bg-card) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-soft) !important;
            border-radius: var(--r-card) !important;
            box-shadow: var(--shadow-lg);
        }

        .btn-primary-full {
            width: 100%;
            height: 54px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dk));
            color: #fff;
            font-size: 1.02rem;
            font-weight: 800;
            box-shadow: 0 4px 22px rgba(45,140,240,.4);
            border-radius: var(--r-btn);
            border: none;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all .22s cubic-bezier(.4,0,.2,1);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }
        .btn-primary-full:hover {
            background: linear-gradient(135deg, var(--primary-lt), var(--primary));
            box-shadow: 0 8px 32px rgba(45,140,240,.55);
            transform: translateY(-2px);
            color: #fff;
        }

        .btn-outline-full {
            width: 100%;
            height: 52px;
            background: rgba(45,140,240,.07);
            border: 1.5px solid rgba(45,140,240,.3);
            color: var(--txt-soft);
            font-size: .95rem;
            font-weight: 700;
            border-radius: var(--r-btn);
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all .22s cubic-bezier(.4,0,.2,1);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }
        .btn-outline-full:hover {
            background: rgba(45,140,240,.14);
            border-color: rgba(45,140,240,.5);
            color: var(--primary-lt);
        }

        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
            border-color: rgba(79, 172, 254, 0.5);
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 1200px;">
        <header class="text-center mb-5">
            <div class="d-flex align-items-center justify-content-center gap-3 mb-2">
                <div class="logo-icon" style="width: 45px; height: 45px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 15px rgba(45,140,240,.6);">
                    <i class="fa-solid fa-stethoscope" style="color: white;"></i>
                </div>
                <h1 class="fw-bold mb-0" style="font-family: 'Nunito', sans-serif; background: linear-gradient(90deg, var(--primary-lt), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem;">Auditoría y Registros</h1>
            </div>
            <p class="subtitle text-center" style="max-width: 600px; margin: 0 auto; color: var(--txt-soft);">Selecciona uno de tus equipos registrados para revisar el desglose técnico detallado del diagnóstico de Machine Learning y la telemetría recolectada en tu dashboard.</p>
        </header>

        <div class="card p-4 p-md-5 border-0 glass-card">
            <h3 class="mb-4 text-white border-bottom pb-3" style="border-color: rgba(255,255,255,0.1)!important;">Mis Escaneos e Historial</h3>
            
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary" style="background: var(--bg-inner) !important; border-color: var(--border-soft) !important; color: var(--txt-soft);"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="search-input" class="form-control bg-dark text-light border-secondary" placeholder="Buscar por equipo, fecha o veredicto..." style="background: var(--bg-inner) !important; border-color: var(--border-soft) !important; border-radius: 0 var(--r-inner) var(--r-inner) 0;">
                </div>
            </div>

            <div class="row g-4" id="history-grid">
                <!-- Javascript will inject cards here -->
                <div class="col-12 py-5 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3" style="color: #acc;">Buscando registros...</p>
                </div>
            </div>
            
            <div class="mt-5 text-center border-top pt-4 d-flex justify-content-center gap-3 flex-wrap" style="border-color: rgba(255,255,255,0.1)!important;">
                <a href="index.html" id="new-diag-link" class="btn-primary-full" style="width: auto; padding: 0 24px;"><i class="fa-solid fa-plus"></i> Nuevo Diagnóstico</a>
                <a href="dashboard.html" id="live-dashboard-link" class="btn-outline-full" style="width: auto; padding: 0 24px;"><i class="fa-solid fa-chart-line"></i> Ir al Dashboard (En vivo)</a>
                <button id="logout-btn" class="btn-outline-full" style="width: auto; padding: 0 24px; border-color: rgba(248,113,113,.3); color: #fca5a5;"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="history.js"></script>
</body>
</html>
