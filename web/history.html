<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Diagnósticos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
            border-color: rgba(79, 172, 254, 0.5);
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container py-5" style="max-width: 1200px;">
        <header class="text-center mb-5">
            <div class="logo-container mx-auto" style="justify-content: center;">
                <div class="pulse-ring"></div>
                <h1>Auditoría y Registros</h1>
            </div>
            <p class="subtitle text-center" style="max-width: 600px; margin: 0 auto;">Selecciona uno de tus equipos registrados para revisar el desglose técnico detallado del diagnóstico de Machine Learning y la telemetría recolectada en tu dashboard.</p>
        </header>

        <div class="glass-panel p-4 p-md-5">
            <h3 class="mb-4 text-white border-bottom pb-3" style="border-color: rgba(255,255,255,0.1)!important;">Mis Escaneos e Historial</h3>
            
            <div class="row g-4" id="history-grid">
                <!-- Javascript will inject cards here -->
                <div class="col-12 py-5 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3" style="color: #acc;">Buscando registros...</p>
                </div>
            </div>
            
            <div class="mt-5 text-center border-top pt-4" style="border-color: rgba(255,255,255,0.1)!important;">
                <a href="index.html" class="btn btn-outline-primary me-2 mb-2">Nuevo Diagnóstico</a>
                <a href="dashboard.html" class="btn btn-outline-info me-2 mb-2">Ir al Dashboard (En vivo)</a>
                <button id="logout-btn" class="btn btn-outline-danger mb-2">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="history.js"></script>
</body>
</html>
